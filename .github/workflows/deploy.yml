name: CI/CD

on:
  #toutes les branches lancent les tests.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement a deployer
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read
  packages: write #requis pour pousser sur ghcr.io

jobs:
  ci:
    runs-on: ubuntu-24.04
    # MongoDB CI remplace mongodb-memory-server sans modifier le code source.
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_EXTERNAL_MONGODB: true
      MONGODB_URI: mongodb://127.0.0.1:27017/ci-tests
      JWT_SECRET: test_jwt_secret
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      #install backend: auth-service
      - name: install auth-service
        working-directory: services/auth-service
        run: npm ci

      #install backend: order-service
      - name: install order-service
        working-directory: services/order-service
        run: npm ci

      #install backend: product-service
      - name: install product-service
        working-directory: services/product-service
        run: npm ci

      #install frontend
      - name: install frontend
        working-directory: frontend
        run: npm ci

      # test backend: auth-service
      - name: test auth-service
        working-directory: services/auth-service
        run: npm test

      # test backend: order-service
      - name: test order-service
        working-directory: services/order-service
        run: npm test

      # test backend: product-service
      - name: test product-service
        working-directory: services/product-service
        run: npm test

      # test frontend
      - name: test frontend
        working-directory: frontend
        run: npm test

      # lint frontend
      - name: lint frontend
        working-directory: frontend
        run: npm run lint

  docker:
    needs: ci
    # Build et push uniquement pour dev, staging et main.
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - service: auth-service
            context: services/auth-service
          - service: order-service
            context: services/order-service
          - service: product-service
            context: services/product-service
          - service: frontend
            context: frontend
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      # ghcr.io refuse les majuscules du nom de repo.
      - name: image to lower case
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # buildx necessaire pour le cache de layers GitHub Actions.
      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      # --load remet l'image dans le daemon local, sinon Trivy ne la trouve pas.
      - name: build image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=${{ matrix.service }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.service }} \
            --load \
            -t local/${{ matrix.service }}:ci \
            ./${{ matrix.context }}

      # Le scan est informatif et ne bloque pas le projet sur un faux positif.
      - name: install trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      # artefact trivy
      - name: scan image
        continue-on-error: true
        run: |
          trivy image \
            --format json \
            --output trivy-image-${{ matrix.service }}.json \
            --severity HIGH,CRITICAL \
            local/${{ matrix.service }}:ci

      - name: upload trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}
          path: trivy-image-${{ matrix.service }}.json
          if-no-files-found: warn

      # Push sur dev, staging et main avec le SHA du commit.
      - name: login ghcr
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # fourni automatiquement

      - name: push image
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
        run: |
          docker tag local/${{ matrix.service }}:ci ghcr.io/$IMAGE/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/$IMAGE/${{ matrix.service }}:${{ github.sha }}

      # Sur main, on pousse aussi le tag latest.
      - name: push latest image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag local/${{ matrix.service }}:ci ghcr.io/$IMAGE/${{ matrix.service }}:latest
          docker push ghcr.io/$IMAGE/${{ matrix.service }}:latest
