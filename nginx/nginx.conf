events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Resolver DNS interne de Swarm : le nom de service "frontend" est resolu
    # vers son IP virtuelle, et Swarm repartit lui-meme la charge entre les
    # trois repliques. Aucun load balancing a configurer ici.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend_upstream {
        server frontend:8080;
    }

    # HTTP : redirige tout le trafic vers HTTPS.
    server {
        listen 80;
        server_name app.local;

        return 301 https://$host$request_uri;
    }

    # HTTPS : terminaison TLS. Le trafic vers le frontend reste en HTTP
    # a l'interieur du reseau overlay.
    server {
        listen 443 ssl;
        server_name app.local;

        ssl_certificate     /etc/nginx/certs/app.local.crt;
        ssl_certificate_key /etc/nginx/certs/app.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://frontend_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }
    }
}