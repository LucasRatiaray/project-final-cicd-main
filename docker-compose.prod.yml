version: '3.8'

services:
  mongodb:
    image: mongo:4.4.18
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-node1

  auth-service:
    image: ${IMAGE_REGISTRY:-ecommerce}/auth-service:${IMAGE_TAG:-local}
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/auth
      CORS_ORIGIN: https://app.local
    secrets:
      - source: app_env
        target: /run/secrets/app.env
    networks:
      - ecommerce_net
    deploy:
      replicas: 2

  product-service:
    image: ${IMAGE_REGISTRY:-ecommerce}/product-service:${IMAGE_TAG:-local}
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/products
      CORS_ORIGIN: https://app.local
    secrets:
      - source: app_env
        target: /run/secrets/app.env
    networks:
      - ecommerce_net
    deploy:
      replicas: 2

  order-service:
    image: ${IMAGE_REGISTRY:-ecommerce}/order-service:${IMAGE_TAG:-local}
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/orders
      CORS_ORIGIN: https://app.local
      PRODUCT_SERVICE_URL: http://product-service:3000
    secrets:
      - source: app_env
        target: /run/secrets/app.env
    networks:
      - ecommerce_net
    deploy:
      replicas: 2

  frontend:
    image: ${IMAGE_REGISTRY:-ecommerce}/frontend:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3000
      ORDER_SERVICE_URL: http://order-service:3002
    networks:
      - ecommerce_net
    deploy:
      replicas: 3
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.frontend.rule=Host(`app.local`)'
        - 'traefik.http.routers.frontend.entrypoints=web'
        - 'traefik.http.services.frontend.loadbalancer.server.port=8080'

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
      - source: nginx_crt
        target: /etc/nginx/certs/app.local.crt
      - source: nginx_key
        target: /etc/nginx/certs/app.local.key
    networks:
      - ecommerce_net
    deploy:
      replicas: 2

networks:
  ecommerce_net:
    driver: overlay

volumes:
  mongodb_data:

configs:
  nginx_conf:
    file: ./nginx/nginx.conf
  nginx_crt:
    file: ./nginx/certs/app.local.crt
  nginx_key:
    file: ./nginx/certs/app.local.key

secrets:
  app_env:
    external: true
